# ez standard test workflow: lint, tests and build, plus the Docker image
# built, booted and healthy. Runs on PRs and on pushes to development;
# publish.yml calls it before every publish.
name: test

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      MARIADB_PASSWORD: ci-mariadb-fixture-only
      MYSQL_PASSWORD: ci-mysql-fixture-only
      PG_PASSWORD: ci-pg-fixture-only
      MONGO_PASSWORD: ci-mongo-fixture-only
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: ezdb_test
          MYSQL_USER: ezdb
          MYSQL_PASSWORD: ci-mysql-fixture-only
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: ezdb_test
          MARIADB_USER: ezdb
          MARIADB_PASSWORD: ci-mariadb-fixture-only
        ports: ["53307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ezdb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-pg-fixture-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ezdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ezdb
          MONGO_INITDB_ROOT_PASSWORD: ci-mongo-fixture-only
        ports: ["57017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile
      - name: Validate version and release tag
        run: bun scripts/validate-release.js
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Real browser smoke suite
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          bun start > "$RUNNER_TEMP/ezdb-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python tests/ui-smoke.py
          python tests/uploads-smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ezdb-browser-evidence
          path: |
            ${{ runner.temp }}/ezdb-shots/
            ${{ runner.temp }}/ezdb-server.log
          if-no-files-found: warn

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ezdb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🔬 Boot and wait for healthy
        run: |
          set -euo pipefail
          docker run -d --name app ezdb:ci
          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; exit 1; }
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          test "$(docker exec app id -u)" = "1000"
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
